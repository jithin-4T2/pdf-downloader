name: Kerala Lottery Direct Repository Saver

on:
  schedule:
    # 6:53 PM IST corresponds to 1:23 PM UTC (Cron format: minute hour day month day-of-week)
    - cron: '23 13 * * *'
  workflow_dispatch:

# Grant write permissions to allow pushing commits back to the repo
permissions:
  contents: write

jobs:
  run-downloader:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

    - name: Install Dependencies
      run: |
        pip install selenium webdriver-manager requests

    - name: Ensure Output Directory Exists
      run: |
        mkdir -p lottery_results

    - name: Run Downloader Script
      run: python download_pdf.py

    - name: Commit and Push Assets to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Track generated PDF artifacts
        git add lottery_results/*.pdf || true
        
        if git diff --staged --quiet; then
          echo "No new document generation detected today."
        else
          git commit -m "Automated Sync: Updated target Kerala Lottery file library"
          git push
        fi
