name: Daily Kerala Lottery Result Scraper

on:
  schedule:
    # 1:40 PM UTC corresponds to 7:10 PM IST (UTC+5:30)
    - cron: '40 13 * * *'
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-101@v5 # Replace with actions/setup-python@v5 if needed
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Run Scraper Script
        run: |
          python download_pdf.py  # Replace with the actual filename of your script

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lottery-results
          path: lottery_results/
