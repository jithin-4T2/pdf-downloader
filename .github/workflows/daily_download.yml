name: Kerala Lottery Direct Repository Saver

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-downloader:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install selenium webdriver-manager requests

    - name: Run Downloader Script
      env:
        TRUECAPTCHA_USER_ID: ${{ secrets.TRUECAPTCHA_USER_ID }}
        TRUECAPTCHA_API_KEY: ${{ secrets.TRUECAPTCHA_API_KEY }}
      run: python download_pdf.py

    - name: Commit and Push Assets to Repository
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # Add files safely even if an operational layout debug snapshot is captured
        git add lottery_results/*
        
        if git diff --staged --quiet; then
          echo "No new document generation detected today."
        else
          git commit -m "Automated Sync: Updated target Kerala Lottery file library"
          git push
        fi
