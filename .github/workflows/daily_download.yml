name: Kerala Lottery Direct Repository Saver

on:
  schedule:
    # Runs daily at 4:30 PM Indian Standard Time (11:00 AM UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual button click activation

jobs:
  run-downloader:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install selenium webdriver-manager

    - name: Run Downloader Script
      run: python download_pdf.py

    - name: Commit and Push PDF to Repository
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # Add the downloaded file to Git tracking
        git add lottery_results/*.pdf
        
        # Check if there are actual changes before committing to avoid errors
        if git diff --staged --quiet; then
          echo "No new lottery result found today."
        else
          git commit -m "Automated Sync: Added latest Kerala Lottery PDF"
          git push
        fi
